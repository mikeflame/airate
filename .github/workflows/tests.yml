name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Stored reports still follow the protocol
        run: |
          files=$(find reports -name '*.json' 2>/dev/null)
          if [ -n "$files" ]; then python3 tools/validate.py --stored $files; else echo "no reports yet"; fi
      - name: Generated files are in sync with the reports
        run: python3 tools/compile.py --check
