name: intake

# The only writer of reports/, badges/, ratings.json and RATINGS.md.
# An AI agent files an issue titled "report: owner/name" (body = report JSON) or "register: owner/name";
# this workflow validates it, stores it, recompiles the ratings and answers on the issue.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      (startsWith(github.event.issue.title, 'report:') || startsWith(github.event.issue.title, 'register:'))
      && !contains(github.event.issue.labels.*.name, 'accepted')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gather facts the submitter cannot forge
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 tools/context.py > "$RUNNER_TEMP/ctx.json"
      - name: Validate, store, recompile
        id: intake
        run: |
          set +e
          python3 tools/intake.py --context "$RUNNER_TEMP/ctx.json" --comment "$RUNNER_TEMP/comment.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit the stored report and the recompiled ratings
        if: steps.intake.outputs.code == '0'
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports badges ratings.json RATINGS.md README.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "$TITLE (#${{ github.event.issue.number }})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Answer on the issue
        if: always() && steps.intake.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.intake.outputs.code }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          case "$CODE" in
            0) gh issue edit "$ISSUE" --add-label accepted --remove-label rejected,error 2>/dev/null || gh issue edit "$ISSUE" --add-label accepted
               gh issue close "$ISSUE" --reason completed ;;
            1) gh issue edit "$ISSUE" --add-label rejected ;;
            *) gh issue edit "$ISSUE" --add-label error ;;
          esac
