name: compile

# Recompile the ratings when the scoring code, a task, the schema or the revocation list changes on main.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tasks/**"
      - "schema/**"
      - "revocations.json"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.INTAKE_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Recompile and push (tools/store.sh)
        run: tools/store.sh --message "compile: recompute ratings" --paths "badges ratings.json RATINGS.md README.md" -- python3 tools/compile.py
